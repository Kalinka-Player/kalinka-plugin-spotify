[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kalinka-plugin-spotify"
version = "0.1.2"
description = "Spotify Connect compressed-stream input for Kalinka"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["kalinka-plugin-sdk>=3.5,<4"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx", "fastapi", "build", "ruff"]

[project.entry-points."kalinka.plugins"]
kalinka_plugin_spotify = "kalinka_plugin_spotify:KalinkaPluginSpotify"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
