name: Companion Kalinka core
description: Check out the pinned Kalinka core with merged SDK 3.5 live-stream support into ./core.
runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        repository: Kalinka-Player/KalinkaPlayer
        # KalinkaPlayer PR #225: SDK, server and renderer live-stream support.
        ref: ad91659ba259f9dbc195f3618653985116407263
        path: core
        fetch-depth: 0
