name: Companion Kalinka core
description: Check out the pinned Kalinka core with SDK 3.18 artwork support into ./core.
runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        repository: Kalinka-Player/KalinkaPlayer
        # KalinkaPlayer PR #465: packaged small and standard artwork.
        ref: a3a5ab798a15e8421be5206cca3d0779f0aa6650
        path: core
        fetch-depth: 0
