name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: 'Commit or tag to test; the event ref when empty'
        type: string
        default: ''
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: ./.github/actions/companion-core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install companion core and plugin
        run: |
          python -m pip install -e core/packages/kalinka-plugin-sdk -e core/packages/kalinka-server -e '.[dev]'
      - run: python -m ruff check src tests scripts
      - run: python -m ruff format --check src tests scripts
      - run: python -m pytest
      - run: python -m build
  librespot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: ./.github/actions/companion-core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
      - name: Build pinned executable
        run: ./scripts/build-librespot.sh
      - name: Test Connect controls, transfers and hidden songs
        run: >-
          cargo test --locked --manifest-path build/librespot/Cargo.toml
          -p librespot-connect --no-default-features
          --features rustls-tls-native-roots --lib kalinka_
      - name: Verify actual pipe output and seek
        run: |
          python -m pip install -e core/packages/kalinka-plugin-sdk
          python scripts/verify-librespot.py build/librespot/target/release/librespot
      - name: Build and inspect Debian package
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev
          python -m pip install build
          ./scripts/build_deb.sh build/librespot/target/release/librespot
          dpkg-deb --info kalinka-plugin-spotify_*_amd64.deb
          dpkg-deb --contents kalinka-plugin-spotify_*_amd64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: kalinka-plugin-spotify-deb
          path: kalinka-plugin-spotify_*_amd64.deb
          if-no-files-found: error
  rpm:
    # The release's RPM checks on one architecture, so a packaging change
    # fails on its pull request rather than on a tag.
    runs-on: ubuntu-24.04
    container:
      image: fedora:44
    steps:
      - name: Install build dependencies
        # git before checkout, or the action downloads a tarball without the
        # history setuptools_scm reads the version from.
        run: dnf install -y git gcc pkgconf-pkg-config rpm-build binutils python3 tar
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: ./.github/actions/companion-core
      - uses: dtolnay/rust-toolchain@stable
      - name: Build pinned executable
        run: ./scripts/build-librespot.sh
      - name: Verify actual pipe output and seek
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install build -e core/packages/kalinka-plugin-sdk
          "$RUNNER_TEMP/venv/bin/python" scripts/verify-librespot.py build/librespot/target/release/librespot
      - name: Build and inspect RPM
        run: |
          PYTHON="$RUNNER_TEMP/venv/bin/python" ./scripts/build_rpm.sh build/librespot/target/release/librespot
          rpm -qpi kalinka-plugin-spotify-*.x86_64.rpm
          rpm -qplv kalinka-plugin-spotify-*.x86_64.rpm
          rpm -qpR kalinka-plugin-spotify-*.x86_64.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: kalinka-plugin-spotify-rpm
          path: kalinka-plugin-spotify-*.x86_64.rpm
          if-no-files-found: error
